name: attendance_app
description: Employee Attendance & Services Mobile App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  geolocator: ^14.0.2
  permission_handler: ^11.3.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.2.2
  lucide_icons_flutter: ^3.1.15
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
